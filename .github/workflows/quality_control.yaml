name: Quality Control

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'

jobs:
  check_changes:
    name: Check File Changes
    runs-on: ubuntu-latest
    outputs:
      has_typescript_changes: ${{ steps.changes.outputs.typescript }}
      has_markdown_changes: ${{ steps.changes.outputs.markdown }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - 'package.json'
              - 'package-lock.json'
            markdown:
              - '**/*.md'
              - '!CLAUDE.md'
              - '.markdownlint.json'

  typescript_quality:
    name: TypeScript Quality
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_typescript_changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint Fix
        run: |
          echo "=== ESLint Fix ==="
          npm run lint:fix || true

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ":robot: style: autofix typescript formatting"

      - name: ESLint Check
        run: |
          echo "=== ESLint Check ==="
          npm run lint

      - name: TypeScript Type Check
        run: |
          echo "=== TypeScript Type Check ==="
          npm run typecheck

  markdown_quality:
    name: Markdown Quality
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.has_markdown_changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Markdown Lint
        run: |
          echo "=== Markdown Lint ==="
          markdownlint-cli2 "**/*.md" "#node_modules" "#CLAUDE.md"

  status:
    name: quality_control_passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - typescript_quality
      - markdown_quality
    steps:
      - name: Check job results
        run: |
          ts_result="${{ needs.typescript_quality.result }}"
          markdown_result="${{ needs.markdown_quality.result }}"

          echo "TypeScript Quality: $ts_result"
          echo "Markdown Quality: $markdown_result"

          # Fail if any job failed
          if [[ "$ts_result" == "failure" ]] || [[ "$markdown_result" == "failure" ]]; then
            echo "::error::Quality control failed"
            exit 1
          fi

          # Success if all jobs passed or were skipped
          if [[ "$ts_result" == "success" || "$ts_result" == "skipped" ]] && \
             [[ "$markdown_result" == "success" || "$markdown_result" == "skipped" ]]; then
            echo "::notice::Quality control passed"
            exit 0
          fi

          # Catch any unexpected state
          echo "::error::Unexpected job state"
          exit 1
