name: Create Release

run-name: "Release ${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.4.2)"
        required: true

permissions:
  contents: write

env:
  NPM_TOKEN: ${{ secrets.CI_NPMJS_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
  GITHUB_USER: ${{ vars.CI_GITHUB_USER }}
  GITHUB_USER_EMAIL: ${{ vars.CI_GITHUB_USER_EMAIL }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}
    steps:
      - name: Create deployment
        id: create_deployment
        run: |
          DEPLOYMENT_ID=$(curl -X POST \
            -H "Authorization: token ${{ env.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d '{"ref": "${{ github.event.inputs.version }}", "environment": "npmjs", "auto_merge": false, "required_contexts": []}' \
            | jq -r '.id')
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Validate input version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "ERROR: version must be like 1.2.3"
            exit 1
          fi
          # Ensure tag doesn't already exist
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: tag $VERSION already exists"
            exit 1
          fi

      - name: Update version in package.json
        run: |
          npm version "$VERSION" --no-git-tag-version
          grep -n '"version"' package.json

      - name: Update version in src/index.ts
        run: |
          sed -i "s/export const VERSION = .*/export const VERSION = '$VERSION';/" src/index.ts
          grep -n "VERSION" src/index.ts

      - name: Configure git identity
        run: |
          git config user.name  "${{ env.GITHUB_USER }}"
          git config user.email "${{ env.GITHUB_USER_EMAIL }}"

      - name: Commit release version
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ":robot: Bump version to ${{ env.VERSION }}"
          branch: main
          file_pattern: "package.json package-lock.json src/index.ts"
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true

  deploy:
    name: Deploy to npm
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  succeed_deployment:
    name: Succeed Deployment
    environment: npmjs
    runs-on: ubuntu-latest
    needs:
      - release
      - deploy
    if: success()
    steps:
      - name: Set deployment status to success
        run: |
          curl -X POST \
            -H "Authorization: token ${{ env.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ needs.release.outputs.deployment_id }}/statuses \
            -d '{"state": "success", "description": "Published to npm successfully", "environment_url": "https://www.npmjs.com/package/youtube-id"}'

  failed_deployment:
    name: Failed Deployment
    environment: npmjs
    runs-on: ubuntu-latest
    needs:
      - release
      - deploy
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "::error::Deployment to npm failed"

      - name: Set deployment status to failure
        run: |
          curl -X POST \
            -H "Authorization: token ${{ env.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ needs.release.outputs.deployment_id }}/statuses \
            -d '{"state": "failure", "description": "Failed to publish to npm"}'
